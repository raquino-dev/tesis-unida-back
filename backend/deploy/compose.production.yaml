name: finanzas-inteligentes-pilot

x-runtime-common: &runtime-common
  Archivos__Ruta: /app/private-storage
  Archivos__PublicBaseUrl: ${PUBLIC_API_URL:?Configure PUBLIC_API_URL}
  Archivos__SigningKey: ${ARCHIVOS_SIGNING_KEY:?Configure ARCHIVOS_SIGNING_KEY}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Configure JWT_SIGNING_KEY}
  Seguridad__TokenPushKey: ${TOKEN_PUSH_ENCRYPTION_KEY:?Configure TOKEN_PUSH_ENCRYPTION_KEY}
  S3__Habilitado: "true"
  S3__Region: us-east-1
  S3__Bucket: ${S3_DOCUMENT_BUCKET:?Configure S3_DOCUMENT_BUCKET}
  S3__Prefijo: ${S3_DOCUMENT_PREFIX:-piloto}
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  # Fail closed: SES is only enabled through the protected production env file
  # after the outbox and delivery limits have been verified.
  Correo__Habilitado: ${CORREO_HABILITADO:-false}
  Correo__Region: us-east-1
  Correo__Remitente: ${SES_FROM_ADDRESS:?Configure SES_FROM_ADDRESS}
  Correo__NombreRemitente: ${SES_FROM_NAME:-Finanzas Inteligentes}
  Correo__UrlAplicacion: ${PUBLIC_APP_URL:?Configure PUBLIC_APP_URL}
  Correo__MaximoEnviosPorDestinatarioHora: ${CORREO_MAXIMO_ENVIOS_POR_DESTINATARIO_HORA:-30}

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  networks:
    pilot:

services:
  migrator:
    image: ${MIGRATOR_IMAGE:-finanzas-migrator:pilot}
    build:
      context: ../..
      dockerfile: backend/Dockerfile.Migrator
    environment:
      FINANZAS_MIGRACIONES_POSTGRESQL: ${MIGRATOR_DATABASE_URL:?Configure MIGRATOR_DATABASE_URL}
    volumes:
      - ./secrets/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    restart: "no"
    networks:
      pilot:

  api:
    image: ${API_IMAGE:-finanzas-api:pilot}
    build:
      context: ../..
      dockerfile: backend/Dockerfile.Api
    environment:
      <<: *runtime-common
      ConnectionStrings__PostgreSql: ${API_DATABASE_URL:?Configure API_DATABASE_URL}
      AWS_ACCESS_KEY_ID: ${API_AWS_ACCESS_KEY_ID:?Configure API_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${API_AWS_SECRET_ACCESS_KEY:?Configure API_AWS_SECRET_ACCESS_KEY}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Enabled: "true"
      ReverseProxy__KnownProxies__0: 172.30.0.2
      DataProtection__KeysPath: /app/data-protection-keys
      DataProtection__CertificatePath: /run/secrets/data-protection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?Configure DATA_PROTECTION_CERTIFICATE_PASSWORD}
      Textract__Habilitado: "false"
      Textract__Region: us-east-1
      Firebase__Habilitado: "false"
      GooglePlay__Habilitado: "true"
      GooglePlay__PermitirProveedorInterno: "false"
      GooglePlay__PackageName: ${GOOGLE_PLAY_PACKAGE_NAME:?Configure GOOGLE_PLAY_PACKAGE_NAME}
      GooglePlay__RtdnAudience: ${GOOGLE_PLAY_RTDN_AUDIENCE:?Configure GOOGLE_PLAY_RTDN_AUDIENCE}
      GooglePlay__RtdnServiceAccountEmail: ${GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:?Configure GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL}
      GooglePlay__Productos__premium-mensual: ${GOOGLE_PLAY_PRODUCT_MONTHLY:?Configure GOOGLE_PLAY_PRODUCT_MONTHLY}
      GooglePlay__Productos__premium-anual: ${GOOGLE_PLAY_PRODUCT_YEARLY:?Configure GOOGLE_PLAY_PRODUCT_YEARLY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    expose:
      - "8080"
    volumes:
      - data-protection-keys:/app/data-protection-keys
      - ./secrets/data-protection.pfx:/run/secrets/data-protection.pfx:ro
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
      - ./secrets/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/salud/listo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *service-security
    networks:
      pilot:
        ipv4_address: 172.30.0.3

  worker:
    image: ${WORKER_IMAGE:-finanzas-worker:pilot}
    build:
      context: ../..
      dockerfile: backend/Dockerfile.Worker
    environment:
      <<: *runtime-common
      ConnectionStrings__PostgreSql: ${WORKER_DATABASE_URL:?Configure WORKER_DATABASE_URL}
      AWS_ACCESS_KEY_ID: ${WORKER_AWS_ACCESS_KEY_ID:?Configure WORKER_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${WORKER_AWS_SECRET_ACCESS_KEY:?Configure WORKER_AWS_SECRET_ACCESS_KEY}
      DOTNET_ENVIRONMENT: Production
      Textract__Habilitado: "true"
      Textract__Region: us-east-1
      Firebase__Habilitado: "true"
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?Configure FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
      - ./secrets/supabase-ca.crt:/run/secrets/supabase-ca.crt:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    <<: *service-security
    networks:
      pilot:
        ipv4_address: 172.30.0.4

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls-fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./secrets/tls-privkey.pem:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Nginx must validate its own process. La disponibilidad de la API se
      # verifica en el servicio api; usar el proxy aquí provoca falsos fallos
      # mientras Docker reemplaza la API durante un despliegue.
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    read_only: true
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    <<: *service-security
    networks:
      pilot:
        ipv4_address: 172.30.0.2

volumes:
  data-protection-keys:

networks:
  pilot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
