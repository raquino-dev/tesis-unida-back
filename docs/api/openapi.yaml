    RestablecimientoContrasenaRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
        nuevaContrasena:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - token
      - nuevaContrasena
    CambiarContrasenaRequest:
      type: object
