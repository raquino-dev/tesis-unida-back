components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^\".+\"$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 500
    Limite:
      name: limite
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    CorrelationId:
      description: Identificador de correlación de la solicitud.
      schema:
        type: string
    ETag:
      description: Versión opaca del recurso.
      schema:
        type: string
    Location:
      description: URI del recurso creado o aceptado.
      schema:
        type: string
        format: uri-reference
  schemas:
    ProcesoAsyncResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          example: pendiente
        creadoEn:
          type: string
          format: date-time
          example: '2026-07-22T18:30:00Z'
        completadoEn:
          type:
          - string
          - 'null'
        errorCodigo:
          type:
          - string
          - 'null'
        urlEstado:
          type: string
          example: "/api/v1/recurso/019b-job-..."
      required:
      - id
      - estado
      - creadoEn
      - urlEstado
    CrearUsuarioRequest:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          example: Rodrigo Aquino
        correo:
          type: string
          format: email
          example: rodrigo@correo.com.py
        contrasena:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        moneda:
          type: string
          enum:
          - PYG
          example: PYG
        idioma:
          type: string
          example: es-PY
        zonaHoraria:
          type: string
          example: America/Asuncion
        aceptaTerminos:
          type: boolean
          example: true
      required:
      - nombre
      - correo
      - contrasena
      - moneda
      - idioma
      - zonaHoraria
      - aceptaTerminos
    UsuarioResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Rodrigo Aquino
        correo:
          type: string
          format: email
          example: rodrigo@correo.com.py
        moneda:
          type: string
          enum:
          - PYG
          example: PYG
        idioma:
          type: string
          example: es-PY
        ubicacion:
          type: string
          example: Asuncion, Paraguay
        zonaHoraria:
          type: string
          example: America/Asuncion
        correoVerificado:
          type: boolean
          example: false
        creadoEn:
          type: string
          format: date-time
          example: '2026-07-22T18:30:00Z'
        version:
          type: integer
          format: int64
          example: 1
      required:
      - id
      - nombre
      - correo
      - moneda
      - idioma
      - ubicacion
      - zonaHoraria
      - correoVerificado
      - creadoEn
      - version
    CrearSesionRequest:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          example: rodrigo@correo.com.py
        contrasena:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        dispositivo:
          type: object
          additionalProperties: false
          properties:
            identificador:
              type: string
              example: android-installation-id
            nombre:
              type: string
              example: Pixel 8
            plataforma:
              type: string
              example: android
            versionSistema:
              type: string
              example: '14'
            versionAplicacion:
              type: string
              example: 0.1.0
          required:
          - identificador
          - nombre
          - plataforma
          - versionSistema
          - versionAplicacion
        recordarDispositivo:
          type: boolean
          example: true
      required:
      - correo
      - contrasena
      - dispositivo
      - recordarDispositivo
    SesionResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        accessToken:
          type: string
          writeOnly: true
        refreshToken:
          type: string
          writeOnly: true
        tipoToken:
          type: string
          writeOnly: true
        accessTokenExpiraEn:
          type: string
          format: date-time
          example: '2026-07-22T18:45:00Z'
        refreshTokenExpiraEn:
          type: string
          format: date-time
          example: '2026-08-21T18:30:00Z'
        requiereOtp:
          type: boolean
          example: false
        usuario:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              example: Rodrigo Aquino
            correo:
              type: string
              format: email
              example: rodrigo@correo.com.py
          required:
          - id
          - nombre
          - correo
      required:
      - id
      - accessToken
      - refreshToken
      - tipoToken
      - accessTokenExpiraEn
      - refreshTokenExpiraEn
      - requiereOtp
      - usuario
    SesionActivaResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              example: Pixel 8
            plataforma:
              type: string
              example: android
          required:
          - id
          - nombre
          - plataforma
        emitidaEn:
          type: string
          format: date-time
          example: '2026-07-22T18:30:00Z'
        expiraEn:
          type: string
          format: date-time
          example: '2026-08-21T18:30:00Z'
        actual:
          type: boolean
          example: true
        revocadaEn:
          type:
          - string
          - 'null'
      required:
      - id
      - dispositivo
      - emitidaEn
      - expiraEn
      - actual
    RenovarSesionRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          writeOnly: true
        identificadorDispositivo:
          type: string
          example: android-installation-id
      required:
      - refreshToken
      - identificadorDispositivo
    RecuperacionContrasenaRequest:
      type: object
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          example: rodrigo@correo.com.py
      required:
